    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
    <script>
        const HAS_SCRDRV = window.CSS && CSS.supports('animation-timeline: view()');
        if (!HAS_SCRDRV) document.documentElement.classList.add('no-scrdrv');

        const lenis = new Lenis({ smoothWheel: true, smoothTouch: false, lerp: 0.09 });
        function raf(t) { lenis.raf(t); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        document.querySelectorAll('a[href^="#"]').forEach(a => {
            a.addEventListener('click', e => {
                const id = a.getAttribute('href');
                if (id.length > 1) {
                    const target = document.querySelector(id);
                    if (target) { e.preventDefault(); lenis.scrollTo(target); }
                }
            });
        });

        const progress = document.getElementById('progress');
        const onScroll = () => {
            const h = document.documentElement;
            const max = h.scrollHeight - h.clientHeight;
            progress.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
        };

        if (!HAS_SCRDRV) {
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
            const io = new IntersectionObserver(entries => {
                entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in-view'); io.unobserve(en.target); } });
            }, { threshold: 0.2 });
            document.querySelectorAll('.reveal, .g-item').forEach(el => io.observe(el));
        }
    </script>
</body>
